<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمة من قلبي ❤️</title>
    <style>
        :root { --warm-bg: #fdf6f6; --soft-text: #5c4d4d; --highlight: #d4a373; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--warm-bg); color: var(--soft-text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
        #content-area { display: none; }
        h1 { color: #8e7d7d; }
        .apology-box { background: #fffaf5; padding: 25px; border-right: 5px solid var(--highlight); border-radius: 10px; text-align: right; line-height: 1.8; margin: 20px 0; font-size: 19px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 80%; text-align: center; font-size: 16px; }
        button { background: var(--highlight); color: white; border: none; padding: 12px 30px; border-radius: 10px; margin-top: 15px; cursor: pointer; transition: 0.3s; font-size: 16px; }
        button:hover { background: #c09060; }
        
        /* مشغل الفيديو المباشر */
        .video-wrapper { margin-top: 20px; margin-bottom: 25px; }
        .my-video { width: 100%; max-height: 380px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); outline: none; background-color: #000; }

        /* شبكة الصور */
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.02); }

        /* نافذة تكبير الصور (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .lightbox-content {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="login-area">
        <h2>عايز أقولك حاجة مهمة.. ✨</h2>
        <input type="password" id="pass" placeholder="كلمة السر...">
        <br>
        <button onclick="checkPass()">افتح الرسالة</button>
    </div>

    <div class="card" id="content-area">
        <h1> أنا عملت جيفت بسيط بس يارب يعجبك🫂❤️</h1>
        
        <div class="apology-box">
            </p>والله من ساعة آخر مرة اتكلمنا وبفكر فيكي كتير. بجد وحشتيني ومفتقد وجودك في يومي أنا لسه بحبك وإنتي بجد وحشتيني ومحبش نفضل كده خالص ياريت نفتح صفحة جديدة ونرجع زي الأول وأحسن.</p>
        </div>

        <h3 style="color: #8e7d7d;">I LOVE YOU SO MUCH ❤️🫂 </h3>
        <div class="video-wrapper">
            <video class="my-video" controls playsinline>
                <source src="https://files.catbox.moe/pakg3w.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <h3 style="margin-top: 30px; color: #8e7d7d;">LU♥️</h3>
        <div class="gallery">
            <img src="https://i.ibb.co/SDy5cJ3D/IMG-20260626-184201.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
            <img src="https://i.ibb.co/qFRGXy60/IMG-20260626-182601.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
            <img src="https://i.postimg.cc/HxZgGYj8/47d5b3f5f6ad362b518480615661dfca.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
            <img src="https://i.postimg.cc/sX6rFj1n/49d7fff49205532f1ca5b654985f4ecf.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
            <img src="https://i.postimg.cc/kGw3NnPV/6c733644fc7f3ef67beee24bfabc469c.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
            <img src="https://i.postimg.cc/NFbq8gvM/fdf7fdf168bf72b823f6776f6fced5cc.jpg" alt="ذكريات" onclick="openLightbox(this.src)">
        </div>
    </div>

    <div id="lightboxOverlay" class="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightboxImg">
    </div>

    <script>
        function checkPass() {
            if(document.getElementById('pass').value === 'esoo') {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('content-area').style.display = 'block';
            } else { alert('كلمة السر غلط.. حاولي تاني يا esoo'); }
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxOverlay').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
